name: ci

# Private repo: Actions minutes are metered, so the gate runs locally (hk pre-push, the merge
# queue); this moves to push/pull_request when the repo goes public.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: stele's freshness class walks verified.sha..HEAD.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          components: clippy, llvm-tools-preview, rustfmt
          # Must match mise.toml's pin: lints.toml enumerates this toolchain's lints, and
          # `lints inventory` fails on any other.
          toolchain: 1.94.0
      # mise.toml's pin: a drifting llvm-cov drifts what the 100 % counts.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # PATH only: AGENTS.md's `commands:` say `mise run …`, and stele's liveness
      # check needs `mise` resolvable; the toolchain comes from the steps above.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo llvm-cov --fail-under-lines 100
      - run: cargo run -q -- inventory
      # stele graph gate (check → emit --check). NEVER `stele build` here: build is the
      # sole writer of .stele/graph.lock, so running it would make check pass trivially.
      - run: curl -fsSL https://raw.githubusercontent.com/jgeschwendt/stele/main/scripts/install.sh | bash -s v0.3.0
      - run: ~/.local/bin/stele check
      - run: ~/.local/bin/stele emit --check
